<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MartPOS</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="scannerModal" class="scanner-modal" role="dialog" aria-modal="true" aria-labelledby="scannerTitle" aria-hidden="true">
    <div class="scanner-content">
      <div class="scanner-header">
        <h3 id="scannerTitle">Scan barcode</h3>
        <button id="closeScanner" class="btn ghost" type="button">Close</button>
      </div>
      <div id="scanner" class="scanner-view"></div>
      <p class="muted">Point the camera at the barcode. Items are added automatically.</p>
    </div>
  </div>
  <div id="modal" class="modal" aria-hidden="true"></div>
  <script src="vendor/quagga.min.js"></script>
  <script src="script.js"></script>
  <script src="reports.js"></script>
  <script src="receipt.js"></script>
</body>
</html>
