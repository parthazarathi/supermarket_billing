<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MartPOS</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
  <div id="app"></div>
  <div id="scannerModal" class="scanner-modal" aria-hidden="true">
    <div class="scanner-content">
      <div class="scanner-header">
        <h3>Scan barcode</h3>
        <button id="closeScanner" class="btn ghost">Close</button>
      </div>
      <div id="scanner" class="scanner-view"></div>
      <p class="muted">Point the camera at the barcode. Items are added automatically.</p>
    </div>
  </div>
  <div id="modal" class="modal" aria-hidden="true"></div>
  <script src="vendor/quagga.min.js"></script>
  <script src="script.js"></script>
  <script src="reports.js"></script>
  <script src="receipt.js"></script>
