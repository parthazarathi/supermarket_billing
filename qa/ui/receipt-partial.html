<!doctype html><html><head><meta charset="utf-8"><style>
      @page { size: 80mm auto; margin: 0; }
      body { margin: 0; }
      
      .rp, .rp * { margin: 0; padding: 0; box-sizing: border-box; }
      .rp { width: 80mm; font-family: Arial, sans-serif; font-size: 12px; color: #000; padding: 3mm; background: #fff; }
      .rp .center { text-align: center; }
      .rp .bold { font-weight: 700; }
      .rp .big { font-size: 16px; font-weight: 700; }
      .rp .sub { font-size: 10px; }
      .rp .hr { border-top: 1px dashed #000; margin: 4px 0; }
      .rp .rrow { display: flex; justify-content: space-between; gap: 4px; }
      .rp table { width: 100%; border-collapse: collapse; }
      .rp th { border-top: 1px dashed #000; border-bottom: 1px dashed #000; text-align: left; font-size: 10px; padding: 2px 0; }
      .rp td { padding: 2px 0; vertical-align: top; }
      .rp td.c, .rp th.c { text-align: center; }
      .rp td.r, .rp th.r { text-align: right; }
      .rp .tot { font-size: 14px; font-weight: 700; }
    
    </style></head><body><div class="rp">
      <div class="center">
        <div class="big">Bharathi Supermarket</div>
        <div class="sub">RRNagar</div>
        
      </div>
      <div class="hr"></div>
      <div class="rrow"><span>Bill: <b>INV-20260913-0011</b></span><span>13-09-2026 21:34</span></div>
      
      
      <table><thead><tr><th class="c">#</th><th class="">Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amt</th></tr></thead>
      <tbody><tr>
        <td class="c">1</td>
        <td>TEST-UI-WIDGET</td>
        <td class="c">3</td>
        <td class="r">80</td>
        <td class="r">240</td>
      </tr></tbody></table>
      <div class="hr"></div>
      <div class="rrow"><span>Items: 1</span><span>Qty: 3</span></div>
      <div class="rrow"><span>Subtotal</span><span>240</span></div>
      <div class="rrow"><span>Discount</span><span>-10</span></div>
      
      <div class="hr"></div>
      <div class="rrow tot"><span>TOTAL</span><span>₹ 230</span></div>
      <div class="rrow"><span>Paid (Cash)</span><span>₹ 50</span></div>
      <div class="rrow bold"><span>Balance Due</span><span>₹ 180</span></div>
      
      <div class="center bold" style="margin-top:4px">You saved ₹ 10</div>
      <div class="hr"></div>
      <div class="center">Thanks! Come again</div></div></body></html>
